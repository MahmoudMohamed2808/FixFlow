<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  ROLES ||--o{ USERS : has
  DEPARTMENTS ||--o{ LOCATIONS : contains
  DEPARTMENTS ||--o{ USERS : employs
  LOCATIONS ||--o{ ASSETS : houses
  ASSET_CATEGORIES ||--o{ ASSETS : classifies
  ASSETS ||--o{ WORK_ORDERS : requires
  ASSETS ||--o{ PREVENTIVE_SCHEDULES : scheduled
  ASSETS ||--o{ DOWNTIME_RECORDS : logs
  USERS ||--o{ WORK_ORDERS : reports
  WORK_ORDERS ||--o{ WORK_ORDER_PARTS : uses
  SPARE_PARTS ||--o{ WORK_ORDER_PARTS : consumed
  SUPPLIERS ||--o{ SPARE_PARTS : supplies
  PREVENTIVE_SCHEDULES ||--o{ WORK_ORDERS : generates
  WORK_ORDERS ||--o| DOWNTIME_RECORDS : causes

  ROLES {
    bigint id PK
    string name
  }
  USERS {
    bigint id PK
    string name
    string email
    string password
    bigint role_id FK
    bigint department_id FK
    string phone
    boolean is_active
  }
  DEPARTMENTS {
    bigint id PK
    string name
  }
  LOCATIONS {
    bigint id PK
    string name
    bigint department_id FK
    bigint parent_id FK
  }
  ASSET_CATEGORIES {
    bigint id PK
    string name
    bigint parent_id FK
  }
  ASSETS {
    bigint id PK
    string name
    string serial_number
    bigint category_id FK
    bigint location_id FK
    date purchase_date
    date warranty_expiry
    string status
    string manufacturer
    string model
  }
  WORK_ORDERS {
    bigint id PK
    string code
    bigint asset_id FK
    string type
    string priority
    string status
    text description
    bigint reported_by FK
    bigint assigned_to FK
    bigint schedule_id FK
    datetime scheduled_date
    datetime started_at
    datetime completed_at
    decimal cost
  }
  PREVENTIVE_SCHEDULES {
    bigint id PK
    bigint asset_id FK
    string title
    string frequency_type
    int frequency_value
    date next_due_date
    boolean is_active
  }
  SPARE_PARTS {
    bigint id PK
    string name
    string code
    string unit
    int quantity_in_stock
    int minimum_quantity
    decimal unit_price
    bigint supplier_id FK
  }
  WORK_ORDER_PARTS {
    bigint id PK
    bigint work_order_id FK
    bigint spare_part_id FK
    int quantity_used
    decimal unit_cost
  }
  SUPPLIERS {
    bigint id PK
    string name
    string phone
    string email
  }
  DOWNTIME_RECORDS {
    bigint id PK
    bigint asset_id FK
    bigint work_order_id FK
    datetime start_time
    datetime end_time
    int duration_minutes
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
